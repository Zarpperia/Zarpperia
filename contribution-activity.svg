<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Monitor de atividade Zarpperia</title>
  <desc id="desc">O GitHub Actions vai substituir este espaço pelo gráfico com dados reais das contribuições dos últimos 31 dias.</desc>
  <defs><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#55D6FF"/><stop offset="100%" stop-color="#44E0A1"/></linearGradient></defs>
  <rect width="1200" height="340" rx="20" fill="#0B1020"/><rect x="1" y="1" width="1198" height="338" rx="19" fill="none" stroke="#1C3554" stroke-width="2"/>
  <circle cx="30" cy="31" r="5" fill="#44E0A1"/><circle cx="48" cy="31" r="5" fill="#55D6FF"/>
  <text x="68" y="38" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1.2" fill="#E6F1FF">ATIVIDADE DE CONTRIBUIÇÕES</text>
  <text x="68" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#91A4BE">MONITOR DE ATIVIDADE · ZARPPERRIA</text>
  <g stroke="#20304A" stroke-dasharray="4 7"><line x1="76" y1="125" x2="1144" y2="125"/><line x1="76" y1="185" x2="1144" y2="185"/><line x1="76" y1="245" x2="1144" y2="245"/></g>
  <path d="M76 235 L160 230 L240 236 L320 196 L400 210 L480 168 L560 185 L640 145 L720 175 L800 138 L880 158 L960 113 L1040 132 L1144 94" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
  <text x="600" y="290" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#E6F1FF">Gráfico pronto para sincronizar</text>
  <text x="600" y="316" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#91A4BE">Após adicionar o workflow ao repositório, execute “Atualizar gráfico de contribuições” em Actions.</text>
</svg>
